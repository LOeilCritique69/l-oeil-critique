<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier des sorties – L'Œil Critique</title>
<meta name="description" content="Le programme des sorties films, séries, animés, jeux vidéo, musiques et événements suivis par L’Œil Critique.">
<meta name="theme-color" content="#0a0a0c">
<meta property="og:title" content="Calendrier des sorties – L'Œil Critique">
<meta property="og:description" content="Le programme des prochaines sorties culturelles.">
<meta property="og:image" content="https://www.l-oeil-critique.com/assets/img/logo_chef_doeuvre_processed_copy.jpg">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://www.l-oeil-critique.com/pages/calendrier.html">
<link rel="canonical" href="https://www.l-oeil-critique.com/pages/calendrier.html">
<link rel="icon" href="../assets/img/logo_chef_doeuvre_processed_copy.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://image.tmdb.org">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600;0,9..144,700;0,9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/chef_d_oeuvre.css">
<style>
:root{color-scheme:dark;--bg:#0a0a0c;--s1:#141417;--s2:#1c1c21;--line:rgba(255,255,255,.1);--ink:#f4efe4;--mut:#8f8b82;--paper:#efe6d2;--hot:#ff4a2b;--brass:#e2b66f;--r:16px;--ease:cubic-bezier(.2,.75,.25,1)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;min-width:320px}
body.cal{margin:0;min-height:100vh;background:var(--bg);color:var(--ink)}
.cal :where(main,.hero,.ov){font:14px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.cal :where(main,.hero,.ov) button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}.cal :where(main,.hero,.ov) a{color:inherit;text-decoration:none}
.cal :where(main,.hero,.ov) :focus-visible{outline:2px solid var(--hot);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.mono{font-family:"JetBrains Mono",monospace}
.k-films{--k:#7fb0ee}.k-series{--k:#6fd0c4}.k-jeux{--k:#b0d588}.k-animes{--k:#f0b66d}.k-evenements{--k:#ea91b0}.k-music{--k:#c9a0e7}.k-autre{--k:#aaa3b8}

/* HERO */
.hero{position:relative;z-index:0;padding:clamp(40px,7vw,90px) 20px 36px;border-bottom:1px solid var(--line);background:radial-gradient(900px 400px at 85% 0,rgba(255,74,43,.22),transparent 70%),radial-gradient(700px 400px at 0 100%,rgba(226,182,111,.1),transparent 70%)}
.hero-in{max-width:1100px;margin:0 auto}
.crumb{font:700 10px "JetBrains Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:0 0 20px}.crumb b{color:var(--hot)}
.hero h1{margin:0;font:900 clamp(3.4rem,13vw,10rem)/.82 Fraunces,Georgia,serif;letter-spacing:-.06em;text-transform:uppercase}
.hero h1 span{display:block;font-style:italic;font-weight:600;color:transparent;-webkit-text-stroke:1.5px var(--ink);letter-spacing:-.04em}
.hero-row{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:center;justify-content:space-between;margin-top:30px}
.hero p{max-width:480px;margin:0;color:#c9c3b6}
.live{display:flex;align-items:baseline;gap:12px}.live b{font:900 3.4rem/1 Fraunces,serif;color:var(--hot)}.live span{font:700 10px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);max-width:130px}
.cta{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:99px;background:var(--ink);color:#111!important;font-weight:700;font-size:.8rem;transition:transform .2s var(--ease),background .2s}.cta:hover{transform:translateY(-2px);background:var(--hot);color:#fff!important}

main{position:relative;z-index:0;width:min(100% - 32px,1100px);margin:0 auto;padding-bottom:90px}

/* AFFICHE DE LA SEMAINE */
.feat{margin-top:34px}
.sh{display:flex;align-items:center;gap:12px;margin:0 0 14px;font:700 10px "JetBrains Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--hot)}.sh::after{content:"";flex:1;height:1px;background:var(--line)}
.fr-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,200px);gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity;scrollbar-width:thin}
.fc{position:relative;aspect-ratio:2/3;scroll-snap-align:start;border-radius:var(--r);overflow:hidden;background:#222 center/cover;text-align:left;display:flex;align-items:flex-end;transition:transform .25s var(--ease)}
.fc:hover{transform:translateY(-5px) rotate(-.6deg)}
.fc::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.05) 62%)}
.fc .tx{position:relative;z-index:1;padding:14px}.fc .d{display:inline-block;margin-bottom:6px;padding:3px 8px;border-radius:4px;background:var(--hot);font:700 9px "JetBrains Mono",monospace;text-transform:uppercase}
.fc .t{font:700 1.05rem/1.2 Fraunces,serif}
.fc .em{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;opacity:.4}.fc.ok .em,.tk .po.ok span{display:none}

.cal .lz{background-position:center;background-size:cover;background-repeat:no-repeat}

/* BARRE */
.bar{position:sticky;top:var(--hh,0px);z-index:5;margin:30px -16px 0;padding:12px 16px 10px;background:rgba(10,10,12,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.br{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1 1 240px}.search input{width:100%;height:44px;padding:0 40px 0 44px;color:var(--ink);background:var(--s1);border:1px solid var(--line);border-radius:12px;font:inherit}
.search input:focus{outline:0;border-color:var(--hot)}.search i{position:absolute;left:15px;top:11px;font-style:normal;opacity:.6}
.search .x{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:8px;background:var(--s2);color:var(--mut);display:none}.search .x.on{display:block}
.seg{display:flex;padding:3px;background:var(--s1);border:1px solid var(--line);border-radius:12px}
.seg button{height:36px;padding:0 14px;border-radius:9px;font:700 10px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);transition:all .18s}
.seg button[aria-pressed=true]{background:var(--ink);color:#111}
.gear{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;font:700 10px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.gear[aria-expanded=true]{color:var(--hot);border-color:var(--hot)}
.chips{display:flex;gap:7px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{--k:var(--brass);flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:8px;font-size:.76rem;font-weight:600;color:#cfc9bc;transition:all .15s}
.chip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--k)}
.chip[aria-pressed=true]{background:var(--k);border-color:var(--k);color:#111}.chip[aria-pressed=true]::before{background:#111}
.chip[data-cat="🎬 Films"]{--k:#7fb0ee}.chip[data-cat="📺 Séries"]{--k:#6fd0c4}.chip[data-cat="🎮 Jeux"]{--k:#b0d588}.chip[data-cat="🍿 Animés"]{--k:#f0b66d}.chip[data-cat="🎪 Événements"]{--k:#ea91b0}.chip[data-cat="🎵 Music"]{--k:#c9a0e7}.chip[data-cat="📦 Autre"]{--k:#aaa3b8}.chip[data-cat=__ALL__]{--k:var(--ink)}.chip[data-cat=__FAV__]{--k:var(--hot)}
.set{display:none;gap:14px 20px;flex-wrap:wrap;align-items:center;margin-top:10px;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:12px;font-size:.78rem;color:#cfc9bc}.set.open{display:flex}
.set select{height:36px;padding:0 10px;color:var(--ink);background:#0d0d10;border:1px solid var(--line);border-radius:8px;font:inherit}.set input{accent-color:var(--hot);margin-right:8px}
.set .rs{margin-left:auto;color:var(--hot);font:700 10px "JetBrains Mono",monospace;text-transform:uppercase}
.info{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font:500 10px "JetBrains Mono",monospace;color:var(--mut)}

/* PROGRAMME */
.mo{position:sticky;top:calc(var(--hh,0px) + 98px);z-index:4;margin:40px 0 6px;padding:6px 0;font:900 clamp(2rem,6vw,3.6rem)/1 Fraunces,serif;letter-spacing:-.04em;text-transform:uppercase;background:linear-gradient(var(--bg) 60%,transparent)}
.mo small{margin-left:10px;font:italic 600 .5em Fraunces,serif;color:var(--hot);letter-spacing:0}
.day{display:grid;grid-template-columns:86px 1fr;gap:6px 18px;padding:18px 0;border-top:1px solid var(--line)}
.dn{position:sticky;top:calc(var(--hh,0px) + 190px);align-self:start}
.dn b{display:block;font:900 3.2rem/.9 Fraunces,serif;letter-spacing:-.05em}.dn span{font:700 10px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.day.now .dn b{color:var(--hot)}.day.now .dn span{color:var(--hot)}
.tks{display:flex;flex-direction:column;gap:12px;min-width:0}

/* TICKET */
.tk{position:relative;display:grid;grid-template-columns:78px 1fr auto;background:var(--paper);color:#17140f;border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;transition:transform .22s var(--ease),box-shadow .22s;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
.tk:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.tk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--k,#999);z-index:1}
.tk .po{display:grid;place-items:center;min-height:112px;background:#cfc4a9 center/cover;font-size:1.6rem}
.tk .bd{padding:14px 16px;display:flex;flex-direction:column;gap:7px;min-width:0}
.tk .tg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{padding:2px 8px;border-radius:5px;background:rgba(23,20,15,.09);font:700 9px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.03em}
.plat{font:500 10px "JetBrains Mono",monospace;color:#6a6252}
.tk h3{margin:0;font:700 1.2rem/1.2 Fraunces,serif;letter-spacing:-.02em}
.rt{margin-left:6px;padding:1px 6px;border-radius:4px;background:#17140f;color:var(--paper);font:700 8px "JetBrains Mono",monospace;text-transform:uppercase;vertical-align:.15em}
.fr{margin-left:6px;padding:1px 5px;border-radius:4px;background:#1c7d6f;color:#fff;font:700 8px "JetBrains Mono",monospace;vertical-align:.15em}
.st{position:relative;width:96px;display:grid;place-items:center;padding:10px;text-align:center;border-left:2px dashed rgba(23,20,15,.3)}
.st::before,.st::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg)}.st::before{top:-9px}.st::after{bottom:-9px}
.st b{display:block;font:900 1.6rem/1 Fraunces,serif;color:var(--hot)}.st span{font:700 8px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#6a6252}
.st.past b{color:#8a8372}
.fz{margin-top:4px;padding:12px 0 0;border-top:1px dashed var(--line)}.fz>p{margin:0 0 10px;font:700 10px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.more{display:block;margin:34px auto 0;padding:13px 26px;border:1px solid var(--ink);border-radius:99px;font:700 11px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;transition:all .2s}.more:hover{background:var(--ink);color:#111}

.tk .hf{position:absolute;top:8px;right:108px;z-index:2;width:32px;height:32px;border-radius:50%;font-size:16px;color:#9a917c;background:rgba(23,20,15,.07);transition:all .15s}.tk .hf:hover{color:var(--hot);transform:scale(1.12)}.tk .hf.on{color:var(--hot);background:rgba(255,74,43,.15)}
.tk h3{padding-right:34px}
.sy{margin:2px 0 0;font-size:.85rem;line-height:1.55;color:#3a3529;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.sy:empty{display:none}
/* MOIS */
.nav{display:grid;grid-template-columns:46px 1fr 46px auto;gap:10px;align-items:center;margin-top:30px}
.nav .lbl{font:900 clamp(1.8rem,5vw,3.2rem)/1 Fraunces,serif;letter-spacing:-.04em;text-transform:uppercase}.nav .lbl small{font:italic 600 .5em Fraunces,serif;color:var(--hot);margin-left:8px}
.mstat{margin-top:6px;font:700 10px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.nb{width:46px;height:46px;border:1px solid var(--line);border-radius:14px;font-size:20px;transition:all .15s}.nb:hover{background:var(--ink);color:#111}
.nt{height:46px;padding:0 18px;border-radius:14px;background:var(--hot);color:#fff;font:700 10px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;transition:transform .2s var(--ease)}.nt:hover{transform:translateY(-2px)}
.gw{margin-top:18px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wd{padding:2px 0 6px;text-align:center;font:700 10px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}.wd.we{color:#b7654f}
.gw .cell{position:relative;min-height:132px;padding:10px;display:flex;flex-direction:column;gap:7px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.gw .cell.we{background:#101013}
.gw .cell.out{background:transparent;border-color:transparent;opacity:.28}
.gw .cell.past{opacity:.55}
.gw .cell.ev{cursor:pointer}.gw .cell.ev:hover{transform:translateY(-4px);border-color:var(--hot);box-shadow:0 14px 28px rgba(0,0,0,.5);opacity:1;z-index:2}
.gw .cell.now{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot),0 0 34px rgba(255,74,43,.22);opacity:1}
.cell .bg{position:absolute;inset:0;opacity:0;transition:opacity .5s}.cell .bg.ok{opacity:.34}
.cell .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,.35),rgba(10,10,12,.93) 70%)}
.cell>.n,.cell>.evs{position:relative;z-index:1}
.cell .n{display:flex;justify-content:space-between;align-items:center;font:900 1.45rem/1 Fraunces,serif;letter-spacing:-.04em;color:#d8d2c5}
.cell.now .n{color:var(--hot)}
.cell .n em{font:700 8px "JetBrains Mono",monospace;font-style:normal;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:99px;background:var(--hot);color:#fff}
.cell .n b{min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;border-radius:99px;background:rgba(255,255,255,.12);font:700 10px "JetBrains Mono",monospace;letter-spacing:0;color:var(--ink)}
.evs{display:flex;flex-direction:column;gap:4px;min-width:0}
.ec{display:flex;align-items:center;min-width:0;padding:4px 7px;border-left:3px solid var(--k,#999);border-radius:5px;background:color-mix(in srgb,var(--k,#999) 20%,rgba(10,10,12,.55));font-size:10px;font-weight:600;color:var(--ink)}
.ec span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmore{padding-left:4px;font:700 9px "JetBrains Mono",monospace;color:var(--hot)}
.mz{margin-top:26px}.mz>p{margin:0 0 10px;font:700 10px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.mz div{display:flex;flex-wrap:wrap;gap:8px}
.zp{display:inline-flex;align-items:center;gap:9px;min-height:36px;padding:0 14px;border:1px dashed rgba(255,255,255,.25);border-radius:99px;background:var(--s1);font-size:.78rem;transition:all .15s}.zp i{width:8px;height:8px;border-radius:2px;background:var(--k,#999)}.zp:hover{border-color:var(--hot);background:var(--s2)}

/* MODALE */
.ov{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}.ov.open{opacity:1;visibility:visible}
.box{width:min(100%,620px);max-height:86vh;overflow:auto;padding:22px;background:var(--paper);color:#17140f;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.6);transform:translateY(12px);transition:transform .25s var(--ease)}.ov.open .box{transform:none}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.mh h2{margin:0;font:900 1.5rem Fraunces,serif;letter-spacing:-.03em}
.mx{width:34px;height:34px;border-radius:50%;background:#17140f;color:var(--paper);font-size:12px}
.mi{display:flex;gap:18px;padding:16px 0;border-top:2px dashed rgba(23,20,15,.25)}.mi:first-of-type{border-top:0;padding-top:0}
.mp{display:grid;place-items:center;width:110px;height:165px;flex:0 0 110px;border-radius:8px;background:#cfc4a9 center/cover;box-shadow:0 10px 24px rgba(0,0,0,.3);font-size:2rem}.mp.ok span{display:none}
.mb{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0}.mb h3{margin:0;font:700 1.4rem/1.2 Fraunces,serif}
.mm{font:500 11px "JetBrains Mono",monospace;color:#4d4638}.sc{padding:2px 8px;border-radius:5px;background:#17140f;color:var(--brass);font:700 10px "JetBrains Mono",monospace}
.ac{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.ab{padding:8px 13px;border-radius:99px;border:1.5px solid #17140f;font:700 10px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.04em}.ab:hover{background:#17140f;color:var(--paper)}

#load{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:var(--bg);transition:opacity .35s,visibility .35s}#load.hide{opacity:0;visibility:hidden}
#load div{text-align:center;font:900 2rem Fraunces,serif;text-transform:uppercase}#load p{margin:8px 0 0;font:500 11px "JetBrains Mono",monospace;color:var(--mut);text-transform:none}
.sp{width:36px;height:36px;margin:0 auto 16px;border:3px solid var(--line);border-top-color:var(--hot);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.state{padding:70px 20px;text-align:center;color:var(--mut)}.state b{display:block;margin-bottom:8px;font:900 2rem Fraunces,serif;color:var(--ink)}
.note{margin-top:26px;text-align:center;font:500 9px "JetBrains Mono",monospace;color:var(--mut)}

@media(max-width:700px){
.mo{top:calc(var(--hh,0px) + 92px)}.day{grid-template-columns:54px 1fr;gap:6px 12px}.dn{top:calc(var(--hh,0px) + 170px)}.dn b{font-size:2.1rem}
.tk{grid-template-columns:64px 1fr}.st{grid-column:1/-1;width:auto;flex-direction:row;display:flex;gap:10px;justify-content:center;border-left:0;border-top:2px dashed rgba(23,20,15,.3);padding:8px}.st::before,.st::after{display:none}.st b{font-size:1.1rem}
.tk h3{font-size:1.05rem}.tk .hf{right:8px}.nav{grid-template-columns:40px 1fr 40px}.nt{grid-column:1/-1}.nb{width:40px;height:40px}.gw{gap:3px}.wd{font-size:8px;letter-spacing:.02em}.gw .cell{min-height:64px;padding:5px 2px;gap:4px;border-radius:8px}.cell .n{justify-content:center;font-size:.95rem}.cell .n b,.cell .n em{display:none}.evs{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px}.ec{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:var(--k,#999)}.ec span{display:none}.cmore{width:100%;text-align:center;padding:0;font-size:8px}.mi{flex-direction:column}.mp{width:90px;height:135px}
.ov{align-items:flex-end;padding:8px}.box{border-radius:20px 20px 12px 12px}.seg button{padding:0 10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body class="cal">
<div id="load" role="status" aria-live="polite"><div><div class="sp"></div>Chargement<p>Récupération du programme…</p></div></div>

<header class="hero"><div class="hero-in">
  <p class="crumb"><a href="../index.html">Accueil</a> / <b>Calendrier</b></p>
  <h1>Les sorties<span>à ne pas manquer</span></h1>
  <div class="hero-row">
    <p>Films, séries, animés, jeux, musique et événements suivis par L’Œil Critique, dans l’ordre où ils sortent.</p>
    <div class="live"><b id="wk">–</b><span>sorties dans les 7 prochains jours</span></div>
    <a class="cta" id="propose" target="_blank" rel="noopener noreferrer">➕ Proposer une sortie</a>
  </div>
</div></header>

<main id="main">
  <section class="feat" id="feat" hidden><h2 class="sh">À l’affiche cette semaine</h2><div class="fr-row" id="featRow"></div></section>

  <div class="bar">
    <div class="br">

/* État */

const nt=s=>norm(search_t(s)).replace(/[^a-z0-9]/g,"").replace(/^(the|le|la|les|un|une)/,""),frCache=new Map(),frDone=new Set(),frKey=it=>nt(it.titre)+"|"+(it.parsed.annee||"");

const frTodo=it=>it.categorie==="🎬 Films"&&["jour","mois","saison","annee"].includes(it.parsed.kind)&&!it.fr&&!frDone.has(frKey(it));
let frRun=false;

/* Rendu : programme */

/* Rendu : mois */
function renderGrid(){

  const lead=(new Date(vy,vm,1).getDay()+6)%7,dim=new Date(vy,vm+1,0).getDate(),prev=new Date(vy,vm,0).getDate(),total=Math.ceil((lead+dim)/7)*7,by=new Map(),f=ITEMS.filter(matches);
  let n=0;f.forEach(it=>{const p=eff(it);if(p.kind==="jour"&&p.annee===vy&&p.mois===vm){(by.get(p.jour)||by.set(p.jour,[]).get(p.jour)).push(it);n++}});

    const cls=`cell ${i%7>4?"we":""} ${ev.length?"ev":""} ${now?"now":""} ${past&&!now?"past":""}`;
    const inner=`${bgIt?`<div class="bg lz" data-id="${bgIt._id}"></div>`:""}<div class="n">${day}${now?"<em>Auj.</em>":ev.length>1?`<b>${ev.length}</b>`:""}</div><div class="evs">${sh.map(it=>`<div class="ec ${kc(it.categorie)}"><span>${esc(clean(it.titre))}</span></div>`).join("")}${rest>0?`<div class="cmore">+${rest} autre${rest>1?"s":""}</div>`:""}</div>`;
    h+=ev.length?`<button type="button" class="${cls}" data-day="${day}" aria-label="${day} ${MOIS[vm]} : ${ev.length} sortie(s)">${inner}</button>`:`<div class="${cls}">${inner}</div>`}
  $("grid").innerHTML=h;$("grid")._by=by;lazy($("grid"));
  const fz=f.filter(it=>{const p=eff(it);return(p.kind==="mois"&&p.annee===vy&&p.mois===vm)||(p.kind==="saison"&&p.annee===vy&&vm>=p.moisDebut&&vm<=p.moisDebut+2)});
  $("mfz").innerHTML=fz.length?`<p>Ce mois-ci · jour non précisé (${fz.length})</p><div>${fz.map(it=>`<button type="button" class="zp ${kc(it.categorie)}" data-id="${it._id}"><i></i>${esc(clean(it.titre))}</button>`).join("")}</div>`:""}
function render(){
  const f=ITEMS.filter(matches),has=cats.size||platform!=="TOUS"||term||onlyFav;
  $("count").textContent=`${f.length} sortie${f.length>1?"s":""}${has?" (filtrées)":""}`;
  renderFeat();$("list").hidden=view!=="liste";$("monthView").hidden=view!=="mois";
  view==="liste"?renderList():renderGrid();
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===view));
  document.querySelectorAll("[data-per]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.per===period))}

/* Modale */
function openModal(items,title){lastFocus=document.activeElement;$("mt").textContent=title;
  $("mbody").innerHTML=items.map((it,i)=>`<div class="mi"><div class="mp lz" data-id="${it._id}" id="mp${i}"><span>${emoji(it.categorie)}</span></div><div class="mb"><h3>${titreHTML(it.titre)}</h3><span class="tag">${esc(it.categorie)}</span><span class="sc" id="sc${i}" hidden></span><span class="mm">📅 ${esc(dateLabel(it))}</span><span class="mm">${useFR&&it.fr?"Date française vérifiée via TMDB":"Date du calendrier éditorial"}</span>${it.plateforme?`<span class="mm">📺 ${esc(it.plateforme)}</span>`:""}<p class="sy" id="sy${i}"></p><div class="ac"><button type="button" class="ab" data-fav="${it._id}">${isFav(it)?"♥ Dans mes favoris":"♡ Ajouter aux favoris"}</button><a class="ab" id="tr${i}" hidden target="_blank" rel="noopener noreferrer">▶ Bande-annonce</a>${gcal(it)?`<a class="ab" target="_blank" rel="noopener noreferrer" href="${esc(gcal(it))}">📆 Google Calendar</a>`:""}${it.lien?`<a class="ab" target="_blank" rel="noopener noreferrer" href="${esc(it.lien)}">🔗 Infos</a>`:""}</div></div></div>`).join("");
  items.forEach((it,i)=>{if(!POSTERS.has(it.categorie))return;fetchPoster(it.titre,eff(it).annee).then(r=>{const b=$("mp"+i);if(!b||!b.isConnected)return;if(r&&r.poster){b.style.backgroundImage=`url("${r.poster}")`;b.classList.add("ok");if(r.score){$("sc"+i).textContent=`⭐ ${r.score}/10`;$("sc"+i).hidden=false}}if(r&&r.id)fetchDetails(r.id,r.type).then(d=>{if(!d||!b.isConnected)return;if(d.overview)$("sy"+i).textContent=d.overview;if(d.trailer){const a=$("tr"+i);a.href=d.trailer;a.hidden=false}})})});
  $("ov").classList.add("open");document.body.style.overflow="hidden";$("mx").focus()}
function closeModal(){if(!$("ov").classList.contains("open"))return;$("ov").classList.remove("open");document.body.style.overflow="";lastFocus&&lastFocus.focus&&lastFocus.focus()}
function trap(e){if(e.key!=="Tab"||!$("ov").classList.contains("open"))return;const f=[...$("ov").querySelectorAll("a[href],button")].filter(x=>x.offsetParent);if(!f.length)return;if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}}

/* Export iCal : favoris si présents, sinon sorties filtrées (dates exactes à venir) */
function exportICS(){
  const ev=(favs.size?ITEMS.filter(isFav):ITEMS.filter(matches)).filter(it=>eff(it).kind==="jour"&&isFuture(it));
  if(!ev.length){alert("Aucune sortie datée à exporter.");return}
  const f=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`,e2=t=>t.replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n"),stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//L'Oeil Critique//Calendrier//FR","CALSCALE:GREGORIAN","X-WR-CALNAME:L'Œil Critique – Sorties"];
  ev.forEach(it=>{const p=eff(it),a=new Date(p.annee,p.mois,p.jour,12),b=new Date(p.annee,p.mois,p.jour+1,12);
    L.push("BEGIN:VEVENT",`UID:${it._id}-${f(a)}@l-oeil-critique.com`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${f(a)}`,`DTEND;VALUE=DATE:${f(b)}`,`SUMMARY:${e2("🍿 "+clean(it.titre))}`,`DESCRIPTION:${e2(it.categorie+(it.plateforme?" – "+it.plateforme:"")+(it.lien?"\n"+it.lien:""))}`,"END:VEVENT")});
  L.push("END:VCALENDAR");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/calendar;charset=utf-8"}));a.download="sorties-loeil-critique.ics";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* Filtres & init */
function buildFilters(){
  const present=new Set(ITEMS.map(i=>i.categorie));cats=new Set([...cats].filter(c=>present.has(c)));
  const list=[...CAT_ORDER.filter(c=>present.has(c)),...[...present].filter(c=>!CAT_ORDER.includes(c))];
  $("cats").innerHTML=[`<button type="button" class="chip" data-cat="__ALL__" aria-pressed="${!cats.size&&!onlyFav}">Tout</button>`,`<button type="button" class="chip" data-cat="__FAV__" aria-pressed="${onlyFav}">♥ Favoris${favs.size?` (${favs.size})`:""}</button>`,...list.map(c=>`<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${cats.has(c)}">${esc(c)}</button>`)].join("");
  const pl=[...new Set(ITEMS.map(i=>i.plateforme).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr"));
  $("plat").innerHTML=`<option value="TOUS">Toutes</option>`+pl.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join("");
  if(platform!=="TOUS"&&pl.includes(platform))$("plat").value=platform;else{platform="TOUS";$("plat").value="TOUS"}$("fr").checked=useFR}
const apply=()=>{limit=PAGE;savePrefs();buildFilters();render();verifyFR()};
function init(){
  const inp=$("q"),x=$("qx"),s=debounce(()=>{term=inp.value;limit=PAGE;render();verifyFR()},180);
  inp.addEventListener("input",()=>{x.classList.toggle("on",!!inp.value);s()});
  x.onclick=()=>{inp.value="";x.classList.remove("on");term="";render();inp.focus()};
  $("cats").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const c=b.dataset.cat;if(c==="__FAV__")onlyFav=!onlyFav;else if(c==="__ALL__"){cats.clear();onlyFav=false}else cats.has(c)?cats.delete(c):cats.add(c);apply()});
  document.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{period=b.dataset.per;apply()});
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;apply()});
  $("gear").onclick=()=>{const o=$("set").classList.toggle("open");$("gear").setAttribute("aria-expanded",o)};
  $("plat").onchange=e=>{platform=e.target.value;apply()};
  $("fr").onchange=e=>{useFR=e.target.checked;savePrefs();render();verifyFR()};
  $("reset").onclick=()=>{cats.clear();onlyFav=false;platform="TOUS";period="avenir";view="liste";useFR=true;term="";inp.value="";x.classList.remove("on");apply()};
  $("refresh").onclick=()=>load();$("ics").onclick=exportICS;
  $("mbody").addEventListener("click",e=>{const h=e.target.closest("[data-fav]");if(!h)return;const it=byId(+h.dataset.fav);if(it){toggleFav(it);h.textContent=isFav(it)?"♥ Dans mes favoris":"♡ Ajouter aux favoris"}});
  const step=d=>{vm+=d;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}render();verifyFR()};$("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);$("mtoday").onclick=()=>{vy=today.getFullYear();vm=today.getMonth();render();verifyFR()};$("mfz").addEventListener("click",e=>{const c=e.target.closest("[data-id]");if(c){const it=byId(+c.dataset.id);it&&openModal([it],clean(it.titre))}});
  let x0=null,y0=null;const mv=$("monthView");mv.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});mv.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1);x0=null},{passive:true});
  const open=e=>{const hf=e.target.closest("[data-fav]");if(hf){const f=byId(+hf.dataset.fav);f&&toggleFav(f);return}const c=e.target.closest("[data-id]");if(c&&!c.classList.contains("po")||c&&c.classList.contains("tk")){const it=byId(+c.dataset.id);it&&openModal([it],clean(it.titre))}};
  ["list","featRow"].forEach(id=>{$(id).addEventListener("click",e=>{if(e.target.id==="more"){limit+=PAGE;renderList();verifyFR();return}open(e)});$(id).addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("tk"))open(e)})});
  $("grid").addEventListener("click",e=>{const c=e.target.closest("[data-day]");if(c)openModal($("grid")._by.get(+c.dataset.day)||[],`${c.dataset.day} ${MOIS[vm]} ${vy}`)});
  $("mx").onclick=closeModal;$("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeModal()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();trap(e);if(view==="mois"&&!$("ov").classList.contains("open")&&!/input|textarea|select/i.test(document.activeElement.tagName)){if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1)}})}

/* Données */
function adapt(raw){if(Array.isArray(raw))return raw;if(!raw||raw.error)throw new Error((raw&&raw.error)||"vide");if(!Array.isArray(raw.items))throw new Error("format");
  return raw.items.map(s=>{const iso=(s.isoDate||"").toString(),date=s.periode?s.periode:s.jour?(iso||`${pad(s.jour)}/${pad(s.mois)}/${s.annee}`):s.mois?`${pad(s.mois)}/${s.annee}`:String(s.annee||"");return{titre:s.titre,date,isoDate:iso,categorie:s.categorie,plateforme:s.plateforme,lien:s.lien}})}
function jsonp(n=1,max=3){return new Promise((res,rej)=>{const cb="handleGAS_"+Math.round(Math.random()*1e9);let sc,t;
  const end=()=>{clearTimeout(t);delete window[cb];sc&&sc.parentNode&&sc.parentNode.removeChild(sc)},retry=err=>{end();n<max?setTimeout(()=>jsonp(n+1,max).then(res,rej),800*n):rej(err)};
  window[cb]=d=>{end();res(d)};sc=document.createElement("script");sc.src=`${API_URL}&callback=${cb}&_t=${Date.now()}`;sc.onerror=()=>retry(new Error("JSONP"));t=setTimeout(()=>retry(new Error("Timeout")),12e3);document.head.appendChild(sc)})}
const readCache=()=>{try{const c=JSON.parse(localStorage.getItem(CACHE_KEY));return c&&Array.isArray(c.data)?c:null}catch(e){return null}},writeCache=d=>{try{localStorage.setItem(CACHE_KEY,JSON.stringify({data:d,ts:Date.now()}))}catch(e){}};
const hideLoad=()=>{const o=$("load");if(o){o.classList.add("hide");setTimeout(()=>o.remove(),400)}};
const setNote=ts=>{const m=Math.max(0,Math.round((Date.now()-ts)/6e4));$("note").textContent=(m<1?"Actualisé à l’instant":`Actualisé il y a ${m} min`)+" · vérification automatique toutes les 3 minutes"};
function show(d,ts){hydrate(d);buildFilters();render();hideLoad();ts&&setNote(ts)}
function load(){if(loading)return loading;const cache=readCache();if(!ITEMS.length&&cache&&cache.data.length)show(cache.data,cache.ts);
  const b=$("refresh");b.disabled=true;b.textContent="↻ Actualisation…";
  loading=(async()=>{try{const d=adapt(await jsonp());$("loadError")?.remove();writeCache(d);show(d,Date.now());lastOK=Date.now();verifyFR()}
    catch(err){console.error(err);if(!ITEMS.length){hideLoad();$("main").insertAdjacentHTML("afterbegin",`<div class="state" id="loadError"><b>Le programme ne répond pas.</b><button class="cta" id="retry" type="button" style="margin-top:12px">Réessayer</button></div>`);$("retry").onclick=()=>load()}$("note").textContent=ITEMS.length?"Actualisation impossible : dernières données conservées.":"Impossible de récupérer les sorties."}
    finally{b.disabled=false;b.textContent="↻ Actualiser";loading=null}})();return loading}
function syncHeader(){let v=0;const cand=[];
  [...document.body.children].forEach(c=>{if(c.matches(".hero,main,.ov,#load,script,style,link"))return;cand.push(c);[...c.children].forEach(k=>cand.push(k))});
  cand.forEach(n=>{const c=getComputedStyle(n),pos=c.position,z=parseInt(c.zIndex,10);
    if(pos==="fixed"||pos==="sticky"){if(!(z>=9990))n.style.zIndex="9990";const r=n.getBoundingClientRect();if(r.top<80)v=Math.max(v,Math.round(r.bottom))}
    else if(pos==="relative"&&n.tagName==="HEADER"&&!(z>=9990))n.style.zIndex="9990"});
  document.documentElement.style.setProperty("--hh",v+"px")}
const hdrObs=new MutationObserver(syncHeader);hdrObs.observe(document.body,{childList:true});setTimeout(()=>hdrObs.disconnect(),5000);
syncHeader();addEventListener("load",syncHeader);addEventListener("resize",syncHeader);setTimeout(syncHeader,400);setTimeout(syncHeader,1500);
init();load();
setInterval(()=>{if(document.visibilityState==="visible")load()},POLL);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-lastOK>POLL)load()});
</script>
